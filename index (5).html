 else if(tab=='link')h+=`<p class='hint'>Tombol persegi panjang di bawah menu home. Isi link https://... atau wa untuk chat WhatsApp admin.</p>`+D.links.map((l,i)=>`<div class='ar'><div class='af'><input data-p='links.${i}.t' value='${esc(l.t)}' placeholder='Teks tombol'><input data-p='links.${i}.u' value='${esc(l.u)}' placeholder='Link (https://... atau wa)'></div>${BTN('links',i)}</div>`).join('')+`<button class='btn o s' onclick="add('links')">+ Tambah tombol</button>`;

$('admbox').addEventListener('input',e=>{const el=e.target,p=el.dataset.p;if(!p)return;let v=el.value;const t=el.dataset.t;
 if(t=='number')v=+v;else if(t=='bool')v=v=='1';else if(t=='arr')v=v.split(',').map(Number).filter(Boolean);else if(t=='chk')v=el.checked;
 S(p,v);afterEdit(p);render()});
$('admbox').addEventListener('change',async e=>{const el=e.target,p=el.dataset.img;if(!p||!el.files[0])return;if(!sb)return toast('Database belum terhubung.');
 try{const blob=await shrink(el.files[0],p.startsWith('slides')?1200:700);const path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  const {error}=await sb.storage.from('product-images').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(error)throw error;
  S(p,sb.storage.from('product-images').getPublicUrl(path).data.publicUrl);afterEdit(p);render();openA();toastS('Gambar terunggah')}catch(err){toast('Upload gagal: '+(err.message||err))}});
